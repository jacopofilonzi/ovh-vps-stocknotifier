name: OVH API smoke test

# Checks the live OVH APIs still match what this version expects (same as `make smoke`).
# Manual only for now: run it from Actions → "OVH API smoke test" → Run workflow.
# To run it automatically, add triggers such as:
#   schedule:
#     - cron: "0 6 * * 1" # Mondays, 06:00 UTC
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node src/main.ts smoke
